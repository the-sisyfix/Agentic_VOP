[project]
name = "agentic-vop-api"
version = "0.1.0"
description = "FastAPI gateway for Agentic_VOP — receives user triggers, dispatches to agents, manages remediation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "supabase>=2.9.0",
    "pydantic>=2.9.0",
    # Pinned to remediate GHSA-4xgf-cpjx-pc3j (symlink secret leak in NestedSecretsSettingsSource).
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.0.1",
    # LangChain + LangGraph stack — replaces direct OpenAI SDK usage.
    #   langchain-core    → base abstractions (messages, prompts, runnables)
    #   langchain-openai  → ChatOpenAI wrapper (pulls in `openai` transitively)
    #   langgraph         → state-machine framework for the Master agent
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=1.4.6",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    # Pinned to remediate GHSA-f4xh-w4cj-qxq8 (TracingMiddleware arbitrary file read).
    "langsmith>=0.8.18",
    # Pinned to remediate CVE-2026-48775 (JsonPlusSerializer arbitrary object reconstruction).
    "langgraph-checkpoint>=4.1.1",
    # Pinned to remediate CVE-2026-48776 (unsanitized path interpolation in HTTP requests)
    # and CVE-2026-104873 (actions= arg misapplied on resource-scoped auth decorators); fixed in 0.4.4.
    "langgraph-sdk>=0.4.6",
    # Pinned to remediate CVE-2026-97687/97688/97689 (HTTPS proxy TLS + streaming-API issues); fixed in 2.8.0.
    "urllib3>=2.8.0",
    # Pinned to remediate CVE-2026-53540/53539/53538 (Content-Length, QuerystringParser issues).
    "python-multipart>=0.0.31",
    # Pinned to remediate CVE-2026-54283/54282 (form limit bypass + path injection).
    "starlette>=1.3.1",
    # MITRE CWE catalog is distributed as a zipped XML feed; lxml parses it.
    "lxml>=5.3.0",
    # Deterministic CVSS vector → numeric score (v2 / v3.x / v4). LLMs can't
    # do the subscore math reliably, so Sub-Agent 1 calls this post-LLM.
    "cvss>=3.2",
    # AES-256-GCM encryption for sensitive scanner credentials at rest.
    # Pinned to remediate PYSEC-2026-3628 (h2 multiple Host header smuggling).
    "h2>=4.4.1",
    # Pinned to remediate CVE-2026-69247 (PKCS7 decryption oracle via distinguishable errors).
    "cryptography>=50.0.0",
    # AWS SDK for DynamoDB-backed vulnerability intelligence lookups.
    "boto3>=1.34.0",
    # Pinned to remediate CVE-2026-102265..102274 (JWT verification bypass + SSRF); fixed in 2.14.0.
    "pyjwt>=2.14.0",
    # Pinned to remediate GHSA-6v7p-g79w-8964 + CVE-2026-114613 (msgpack
    # deserialization + decoded-value leak on strict_map_key rejection).
    "msgpack>=1.2.3",
    # Pinned to remediate PYSEC-2026-3455/3456/3457 (pyasn1 quadratic OID parsing + unbounded tag + Real exponentiation).
    "pyasn1>=0.6.4",
    # Transitive via langgraph/fsspec consumers. Pinned to remediate CVE-2026-104851
    # (ReferenceFileSystem Kerchunk JSON parsing issue); fixed in 2026.6.0.
    "fsspec>=2026.6.0",
    # Transitive via requests/boto3/httpx/supabase. Pinned to remediate
    # PYSEC-2026-4320 (compromised emSign/eMudhra root CA in the bundled CA
    # store); fixed in 2026.10.18.
    "certifi>=2026.10.18",
    # Transitive via aiohttp/langchain stack. Pinned to remediate CVE-2026-104874
    # (reference leak in items-view union/subtraction, C extension); fixed in 6.9.1.
    "multidict>=6.9.1",
    # Tavily web-search API for the agentic Sub-Agent 3 (Phase-2 remediation).
    # Free tier = 1000 searches/month. Get key at https://tavily.com.
    "tavily-python>=0.5.0",
    # Content extraction for the agent's url_fetch tool — strips HTML down to
    # readable text/markdown, preserves code blocks + headings. Uses lxml
    # (already pinned above) under the hood.
    "trafilatura>=1.12.0",
    # HITL v2 Git-native review (Phase B, side experiment) — only imported
    # when the git-review orchestrator branch runs. Existing pipelines don't
    # load it. GitHub REST/GraphQL wrapper for creating PRs, merging, closing.
    "PyGithub>=2.5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "pip-audit>=2.10.0",
    # Pinned to remediate PYSEC-2026-196.
    "pip>=26.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, undefined names)
    "B",   # flake8-bugbear (likely bugs and bad practices)
    "S",   # flake8-bandit subset (security-adjacent patterns)
    "UP",  # pyupgrade (modern Python idioms)
]
ignore = [
    "S101",  # assert usage — acceptable in tests
    "S603",  # subprocess without shell=True — used intentionally nowhere yet
    "E501",  # line too long — handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S"]  # silence security rules in test files
