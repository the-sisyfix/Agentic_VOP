# =============================================================================
# Image Forge - Sign & Attest Hardened Base Image
# =============================================================================
# Manually-triggered workflow that keylessly signs a hardened base image in ECR
# and attaches SBOM + SLSA provenance attestations.
#
# This is the "Option A" signing step: the build happens on the dedicated EC2
# build box; this workflow signs the already-pushed image BY DIGEST, using the
# GitHub Actions OIDC identity via Sigstore (cosign + Fulcio + Rekor).
#
# Why signing runs here, not on the build box:
#   - Keyless signing needs an OIDC identity that Fulcio trusts. GitHub Actions
#     has one natively; a plain EC2 does not.
#   - Separating build (EC2) from sign (CI) means the signing identity is never
#     on the build host -- advancing the SLSA L3 "signing secret not accessible
#     to build steps" requirement.
#
# Inputs:
#   image_digest: the exact sha256 digest to sign (from the build box push output)
#   image_tag:    the tag that was pushed (e.g. v0.1.0) -- for display/logging only
#
# The workflow:
#   1. Assumes the CI signing role (sisyfix-github-image-sign-dev) via OIDC
#   2. Authenticates to ECR
#   3. Keylessly signs the image digest (cosign sign)
#   4. Attaches the SBOM as a cosign attestation
#   5. Generates and attaches SLSA build provenance
#
# Public Sigstore note: signatures and attestations are recorded in the PUBLIC
# Rekor transparency log. Fine for this test image; switch to private Sigstore
# before real client images.
#
# Safety:
#   - Only runs on main (OIDC trust gated to main in IAM)
#   - workflow_dispatch only (manual trigger)
#   - Concurrency group prevents concurrent signing runs
# =============================================================================

name: "Image Forge: Sign & Attest"

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: "Image digest to sign (sha256:... from the build box push output)"
        required: true
        type: string
      image_tag:
        description: "Image tag that was pushed (e.g. v0.1.0) -- for logging only"
        required: false
        default: "v0.1.0"
        type: string
      sbom_bucket:
        description: "S3 bucket holding the build-box SBOM (sboms/<digest>.spdx.json)"
        required: false
        default: "sisyfix-dev-image-forge-sbom-486655355038"
        type: string

permissions:
  id-token: write   # OIDC token for AWS + Fulcio keyless signing
  contents: read

concurrency:
  group: image-sign
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPO: sisyfix-hardened-base-test
  # Full ECR image reference (without tag/digest -- those come from inputs)
  ECR_IMAGE: 486655355038.dkr.ecr.us-east-1.amazonaws.com/sisyfix-hardened-base-test

jobs:
  sign-and-attest:
    name: "Sign & Attest · Hardened Base Image"
    runs-on: ubuntu-latest
    # Hard safety net: a hung step (e.g. cosign verify draining a large payload
    # on a multi-arch index) can never run for hours. Signing + attestation are
    # done well before the verify smoke-tests, so a cap here is safe.
    timeout-minutes: 20

    steps:
      # ── 0. Checkout (needed for provenance -- source context) ──
      - uses: actions/checkout@v4

      # ── 1. Install cosign ──
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # ── 2. Configure AWS credentials (OIDC → CI signing role) ──
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/sisyfix-github-image-sign-dev
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gh-image-sign-${{ github.run_id }}

      # ── 3. Authenticate Docker to ECR ──
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ── 4. Keyless sign the image digest ──
      - name: Sign image (keyless via Fulcio/Rekor)
        env:
          DIGEST: ${{ inputs.image_digest }}
        run: |
          echo "Signing image: ${{ env.ECR_IMAGE }}@${DIGEST}"
          cosign sign --yes "${{ env.ECR_IMAGE }}@${DIGEST}"
          echo "✅ Image signed successfully"

      # ── 5. Attach the build-box SBOM as an attestation ──
      # The build box generated the SBOM (syft, from the exact arm64 image) and
      # uploaded it to S3 keyed by digest. We download it BY DIGEST and attest
      # it. cosign attaches the attestation by digest WITHOUT pulling the image,
      # so this is arch-independent (works on the amd64 runner) — the fix for
      # the earlier regenerate-in-CI failure (arm64/amd64 mismatch + 401).
      - name: Download SBOM from S3 (by digest)
        env:
          DIGEST: ${{ inputs.image_digest }}
        run: |
          # S3 key mirrors the build box's upload path: sboms/<digest>.spdx.json
          # (slashes in the digest are not an issue — the digest has none; it is
          # "sha256:<hex>", and ':' is a valid S3 key character.)
          S3_KEY="sboms/${DIGEST}.spdx.json"
          echo "Downloading s3://${{ inputs.sbom_bucket }}/${S3_KEY}"
          aws s3 cp "s3://${{ inputs.sbom_bucket }}/${S3_KEY}" /tmp/sbom.spdx.json
          echo "SBOM size: $(wc -c < /tmp/sbom.spdx.json) bytes"

      - name: Attach SBOM as attestation
        env:
          DIGEST: ${{ inputs.image_digest }}
        run: |
          echo "Attaching SBOM attestation to ${{ env.ECR_IMAGE }}@${DIGEST}"
          cosign attest --yes \
            --type spdxjson \
            --predicate /tmp/sbom.spdx.json \
            "${{ env.ECR_IMAGE }}@${DIGEST}"
          echo "✅ SBOM attestation attached"

      # ── 6. Generate and attach SLSA build provenance ──
      - name: Attach SLSA build provenance
        env:
          DIGEST: ${{ inputs.image_digest }}
        run: |
          # Build a minimal SLSA v1.0 provenance predicate.
          # In a full L3 setup this would come from the build platform itself;
          # for the first slice we generate it here with the facts we know.
          cat > /tmp/slsa-provenance.json <<PROVENANCE
          {
            "buildDefinition": {
              "buildType": "https://slsa.dev/container-based-build/v0.1?draft",
              "externalParameters": {
                "source": {
                  "uri": "git+https://github.com/${{ github.repository }}@refs/heads/${{ github.ref_name }}",
                  "digest": {
                    "sha1": "${{ github.sha }}"
                  }
                },
                "builderImage": {
                  "uri": "${{ env.ECR_IMAGE }}",
                  "digest": {
                    "sha256": "$(echo '${{ inputs.image_digest }}' | sed 's/sha256://')"
                  }
                }
              },
              "internalParameters": {
                "buildPlatform": "dedicated-ec2-arm64",
                "signingPlatform": "github-actions-oidc"
              }
            },
            "runDetails": {
              "builder": {
                "id": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              },
              "metadata": {
                "invocationId": "${{ github.run_id }}/${{ github.run_attempt }}",
                "startedOn": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              }
            }
          }
          PROVENANCE

          echo "Attaching SLSA provenance attestation"
          cosign attest --yes \
            --type slsaprovenance1 \
            --predicate /tmp/slsa-provenance.json \
            "${{ env.ECR_IMAGE }}@${DIGEST}"
          echo "✅ SLSA provenance attestation attached"

      # ── 7. Verify the signature (smoke test) ──
      # NOTE: cosign verify / verify-attestation stream the verified payload(s)
      # to stdout AFTER printing the verification result. In this runner that
      # stdout stream can block and hang the step even though verification
      # already succeeded. We redirect stdout to a file so the stream drains
      # and cosign exits; the exit CODE (pass/fail) is preserved, so a real
      # verification failure still fails the step. A `timeout` guards against
      # any future hang instead of letting it run for minutes.
      # ── 7. Verify the SIGNATURE (smoke test) ──
      # MVP scope: we verify ONLY the signature here — a lightweight check that
      # confirms the image digest was signed by the expected GitHub Actions
      # identity. It is small and reliable on the runner.
      #
      # We deliberately DO NOT verify the SLSA/SBOM ATTESTATIONS in this
      # workflow. `cosign verify-attestation` streams the full verified
      # predicate (the ~2.6 MB SPDX SBOM for a multi-arch index) to stdout,
      # which hangs the GitHub-hosted runner's log pipe — even though the same
      # command exits 0 in seconds on the build box. The attestations are still
      # SIGNED + ATTACHED in ECR (the `.att` artifact); verifying them is the
      # CONSUMER's job at pull/deploy time, not the signer's. To verify an
      # attestation downstream:
      #   cosign verify-attestation --type spdxjson \
      #     --certificate-identity-regexp '.../image-sign.yml@.*' \
      #     --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
      #     <IMAGE>@<DIGEST>
      # (Enhance later: consumer-side verification / admission control.)
      - name: Verify signature
        env:
          DIGEST: ${{ inputs.image_digest }}
        run: |
          echo "Verifying signature on ${{ env.ECR_IMAGE }}@${DIGEST}"
          # Signature verify only — small payload, no attestation predicate to
          # stream, so no runner drain hang. Strict: a real failure fails the
          # job. stdout → file keeps the log clean; exit code is authoritative.
          if ! cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.github/workflows/image-sign.yml@.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ env.ECR_IMAGE }}@${DIGEST}" > /tmp/verify-sig.out 2>&1; then
            echo "❌ Signature verification FAILED. Output:"
            cat /tmp/verify-sig.out
            exit 1
          fi
          grep -A20 "verified using trusted certificate" /tmp/verify-sig.out || true
          echo "✅ Signature verification passed"
            exit 1
          fi

      # ── 9. Summary ──
      - name: Summary
        env:
          DIGEST: ${{ inputs.image_digest }}
          TAG: ${{ inputs.image_tag }}
        run: |
          echo "## Image Forge: Sign & Attest Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Image** | \`${{ env.ECR_IMAGE }}:${TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${DIGEST}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Signed** | ✅ Keyless (Fulcio + Rekor), signature verified |" >> $GITHUB_STEP_SUMMARY
          echo "| **SLSA Provenance** | ✅ Attestation attached (verify at consume-time) |" >> $GITHUB_STEP_SUMMARY
          echo "| **SBOM** | ✅ SPDX attestation attached, build-box-generated via S3 (verify at consume-time) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Signing Identity** | GitHub Actions OIDC (\`${{ github.repository }}\`) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Transparency Log** | Public Rekor |" >> $GITHUB_STEP_SUMMARY
          echo "| **Verify command** | \`cosign verify --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.*' --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' ${{ env.ECR_IMAGE }}@${DIGEST}\` |" >> $GITHUB_STEP_SUMMARY
