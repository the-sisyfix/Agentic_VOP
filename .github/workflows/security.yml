# =============================================================================
# Agentic_VOP — Security Quality Gate
# =============================================================================
# Runs on every push (all branches) and every pull request.
#
# Jobs (all parallel):
#   bandit         — Python SAST (apps/api)
#   bandit-lambdas — Python SAST (lambdas/)
#   semgrep        — JS/JSX SAST + SQL injection patterns + Python SAST (apps/web, supabase/, lambdas/)
#   gitleaks       — Secrets / credential scanning (whole repo)
#   pip-audit      — Python SCA via uv.lock export (apps/api)
#   pip-audit-lambdas — Python SCA via requirements.txt (lambdas/)
#   npm-audit      — JS SCA via package-lock.json (apps/web)
#
# Gate logic (enforced in every job, not just the final gate job):
#   Critical / High  → exit 1  → pipeline fails  → PR cannot merge
#   Medium / Low     → printed as warnings        → pipeline passes
# =============================================================================

name: Security Quality Gate

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-flight runs for the same branch/PR to avoid queue pile-ups.
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ---------------------------------------------------------------------------
  # 1. Bandit — Python SAST
  # ---------------------------------------------------------------------------
  bandit:
    name: "SAST · Python (Bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      # Run at medium+ confidence. Output full JSON for parsing.
      # --exit-zero ensures Bandit always writes the JSON report and exits 0
      # regardless of findings — gate logic below handles the blocking decision.
      - name: Run Bandit
        id: bandit_run
        run: |
          bandit -r apps/api/app \
            -f json \
            -o bandit-report.json \
            --confidence-level medium \
            --severity-level low \
            --exit-zero \
            -x apps/api/app/tests

      # Parse the JSON and apply the Critical/High-block / Medium-Low-warn gate.
      - name: Evaluate Bandit results
        run: |
          python - <<'EOF'
          import json, sys, os

          report_path = "bandit-report.json"
          if not os.path.exists(report_path) or os.path.getsize(report_path) == 0:
              print("::error::bandit-report.json is missing or empty — Bandit likely failed to run.")
              print("Check the 'Run Bandit' step output above for the actual error.")
              sys.exit(1)

          with open(report_path) as f:
              report = json.load(f)

          results = report.get("results", [])
          high_block   = [r for r in results if r["issue_severity"] in ("HIGH", "CRITICAL")]
          medium_warn  = [r for r in results if r["issue_severity"] == "MEDIUM"]
          low_warn     = [r for r in results if r["issue_severity"] == "LOW"]

          if medium_warn or low_warn:
              print("::warning::Bandit — Medium/Low findings (non-blocking):")
              for r in medium_warn + low_warn:
                  print(f"  [{r['issue_severity']}] {r['filename']}:{r['line_number']} — {r['issue_text']}")

          if high_block:
              print("::error::Bandit — Critical/High findings BLOCK this pipeline:")
              for r in high_block:
                  print(f"  [{r['issue_severity']}] {r['filename']}:{r['line_number']} — {r['issue_text']}")
              sys.exit(1)

          print(f"Bandit passed. High/Critical: 0 | Medium: {len(medium_warn)} | Low: {len(low_warn)}")
          EOF

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 1b. Bandit — Python SAST (Lambdas)
  # ---------------------------------------------------------------------------
  bandit-lambdas:
    name: "SAST · Python Lambdas (Bandit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        id: bandit_run
        run: |
          bandit -r lambdas \
            -f json \
            -o bandit-lambdas-report.json \
            --confidence-level medium \
            --severity-level low \
            --exit-zero \
            -x lambdas/nvd_sync/tests,lambdas/shared/tests

      - name: Evaluate Bandit results
        run: |
          python - <<'EOF'
          import json, sys, os

          report_path = "bandit-lambdas-report.json"
          if not os.path.exists(report_path) or os.path.getsize(report_path) == 0:
              print("::error::bandit-lambdas-report.json is missing or empty — Bandit likely failed to run.")
              print("Check the 'Run Bandit' step output above for the actual error.")
              sys.exit(1)

          with open(report_path) as f:
              report = json.load(f)

          results = report.get("results", [])
          high_block   = [r for r in results if r["issue_severity"] in ("HIGH", "CRITICAL")]
          medium_warn  = [r for r in results if r["issue_severity"] == "MEDIUM"]
          low_warn     = [r for r in results if r["issue_severity"] == "LOW"]

          if medium_warn or low_warn:
              print("::warning::Bandit (lambdas) — Medium/Low findings (non-blocking):")
              for r in medium_warn + low_warn:
                  print(f"  [{r['issue_severity']}] {r['filename']}:{r['line_number']} — {r['issue_text']}")

          if high_block:
              print("::error::Bandit (lambdas) — Critical/High findings BLOCK this pipeline:")
              for r in high_block:
                  print(f"  [{r['issue_severity']}] {r['filename']}:{r['line_number']} — {r['issue_text']}")
              sys.exit(1)

          print(f"Bandit (lambdas) passed. High/Critical: 0 | Medium: {len(medium_warn)} | Low: {len(low_warn)}")
          EOF

      - name: Upload Bandit Lambdas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-lambdas-report
          path: bandit-lambdas-report.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 2. Semgrep — JS/JSX SAST + SQL patterns + Python SAST (lambdas)
  # ---------------------------------------------------------------------------
  semgrep:
    name: "SAST · JS/SQL/Python (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.127.0
    steps:
      - uses: actions/checkout@v4

      # Run OSS rule packs for JS/TS security + generic secrets + SQL injection + Python security.
      # Output JSON for gate parsing.
      - name: Run Semgrep
        run: |
          semgrep scan \
            --config "p/javascript" \
            --config "p/react" \
            --config "p/sql-injection" \
            --config "p/secrets" \
            --config "p/python" \
            --json \
            --output semgrep-report.json \
            apps/web/src \
            supabase/migrations \
            lambdas \
            || true

      - name: Evaluate Semgrep results
        run: |
          python3 - <<'EOF'
          import json, sys

          with open("semgrep-report.json") as f:
              report = json.load(f)

          findings = report.get("results", [])

          # Semgrep severity: ERROR → High/Critical, WARNING → Medium, INFO → Low
          block_levels = {"ERROR"}
          warn_levels  = {"WARNING", "INFO"}

          blocking = [f for f in findings if f.get("extra", {}).get("severity", "").upper() in block_levels]
          warnings = [f for f in findings if f.get("extra", {}).get("severity", "").upper() in warn_levels]

          if warnings:
              print("::warning::Semgrep — Warning/Info findings (non-blocking):")
              for f in warnings:
                  path = f.get("path", "?")
                  line = f.get("start", {}).get("line", "?")
                  msg  = f.get("extra", {}).get("message", "")[:120]
                  print(f"  [WARN] {path}:{line} — {msg}")

          if blocking:
              print("::error::Semgrep — ERROR-level findings BLOCK this pipeline:")
              for f in blocking:
                  path = f.get("path", "?")
                  line = f.get("start", {}).get("line", "?")
                  msg  = f.get("extra", {}).get("message", "")[:120]
                  print(f"  [ERROR] {path}:{line} — {msg}")
              sys.exit(1)

          print(f"Semgrep passed. Blocking: 0 | Warnings: {len(warnings)}")
          EOF

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 3. Gitleaks — Secrets / credential scanning
  # ---------------------------------------------------------------------------
  gitleaks:
    name: "Secrets (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so Gitleaks can scan all commits on the branch,
          # not just the latest snapshot.
          fetch-depth: 0

      # Use the open-source Gitleaks CLI (MIT) directly instead of the
      # gitleaks-action wrapper. The wrapper requires a paid GITLEAKS_LICENSE
      # for repos owned by a GitHub organization; the CLI binary does not.
      # Behavior preserved: scans full git history and BLOCKS (exit 1) on any
      # detected secret. Honors the repo-root .gitleaks.toml allowlist.
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION="8.30.1"
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run Gitleaks
        run: |
          # 'git' scans the full commit history (via git log -p); fetch-depth: 0
          # above ensures all commits are present. Any finding returns exit code 1,
          # which fails this job and the overall security gate.
          # ('detect' was deprecated in v8.19.0 in favor of the 'git' subcommand.)
          gitleaks git . \
            --config .gitleaks.toml \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks-report.sarif

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.sarif
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4. pip-audit — Python SCA (exact locked deps via uv.lock)
  # ---------------------------------------------------------------------------
  pip-audit:
    name: "SCA · Python (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      # Export only production deps (no dev) from the locked uv.lock.
      - name: Export locked requirements
        working-directory: apps/api
        run: uv export --frozen --no-dev --no-hashes -o requirements-locked.txt

      - name: Install pip-audit
        run: pip install pip-audit

      # --desc on  → include vulnerability descriptions in output
      # --format json → machine-parseable for gate logic
      - name: Run pip-audit
        id: pip_audit_run
        working-directory: apps/api
        run: |
          pip-audit \
            -r requirements-locked.txt \
            --desc on \
            --format json \
            -o pip-audit-report.json \
            || true

      - name: Evaluate pip-audit results
        working-directory: apps/api
        run: |
          python - <<'EOF'
          import json, sys

          with open("pip-audit-report.json") as f:
              report = json.load(f)

          # pip-audit JSON: list of {name, version, vulns: [{id, fix_versions, aliases, description}]}
          dependencies = report.get("dependencies", [])
          blocking = []
          warnings = []

          for dep in dependencies:
              for vuln in dep.get("vulns", []):
                  # pip-audit doesn't emit severity directly; treat all CVEs as blocking
                  # (they represent known exploitable vulnerabilities in locked deps).
                  entry = {
                      "package": dep["name"],
                      "version": dep["version"],
                      "id": vuln["id"],
                      "aliases": vuln.get("aliases", []),
                      "fix_versions": vuln.get("fix_versions", []),
                      "description": vuln.get("description", "")[:200],
                  }
                  # BLOCK only if a fix exists
                  if vuln.get("fix_versions"):
                      blocking.append(entry)
                  # WARN only if no fix available
                  else:
                      warnings.append(entry)    

          if warnings:
              print("::warning::pip-audit — Vulnerabilities with NO FIX available (non-blocking):")
              for v in warnings:
                  print(
                      f"  {v['package']}=={v['version']} "
                      f"[{v['id']}] fix: no fix available — "
                      f"{v['description']}"
                  )          

          if blocking:
              print("::error::pip-audit — Vulnerable dependencies BLOCK this pipeline:")
              for v in blocking:
                  fix = ", ".join(v["fix_versions"]) or "no fix available"
                  print(f"  {v['package']}=={v['version']} [{v['id']}] fix: {fix} — {v['description']}")
              sys.exit(1)

          print("pip-audit passed. No known vulnerabilities in locked dependencies.")
          EOF

      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: apps/api/pip-audit-report.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 4b. pip-audit — Python SCA (lambdas/requirements.txt)
  # ---------------------------------------------------------------------------
  pip-audit-lambdas:
    name: "SCA · Python Lambdas (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        working-directory: lambdas
        run: |
          pip-audit \
            -r requirements.txt \
            --desc on \
            --format json \
            -o pip-audit-lambdas-report.json \
            || true

      - name: Evaluate pip-audit results
        working-directory: lambdas
        run: |
          python - <<'EOF'
          import json, sys

          with open("pip-audit-lambdas-report.json") as f:
              report = json.load(f)

          dependencies = report.get("dependencies", [])
          blocking = []
          warnings = []

          for dep in dependencies:
              for vuln in dep.get("vulns", []):
                  entry = {
                      "package": dep["name"],
                      "version": dep["version"],
                      "id": vuln["id"],
                      "aliases": vuln.get("aliases", []),
                      "fix_versions": vuln.get("fix_versions", []),
                      "description": vuln.get("description", "")[:200],
                  }
                  if vuln.get("fix_versions"):
                      blocking.append(entry)
                  else:
                      warnings.append(entry)

          if warnings:
              print("::warning::pip-audit (lambdas) — Vulnerabilities with NO FIX available (non-blocking):")
              for v in warnings:
                  print(
                      f"  {v['package']}=={v['version']} "
                      f"[{v['id']}] fix: no fix available — "
                      f"{v['description']}"
                  )

          if blocking:
              print("::error::pip-audit (lambdas) — Vulnerable dependencies BLOCK this pipeline:")
              for v in blocking:
                  fix = ", ".join(v["fix_versions"]) or "no fix available"
                  print(f"  {v['package']}=={v['version']} [{v['id']}] fix: {fix} — {v['description']}")
              sys.exit(1)

          print("pip-audit (lambdas) passed. No known vulnerabilities in locked dependencies.")
          EOF

      - name: Upload pip-audit lambdas report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-lambdas-report
          path: lambdas/pip-audit-lambdas-report.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # 5. npm audit — JS SCA
  # ---------------------------------------------------------------------------
  npm-audit:
    name: "SCA · JS (npm audit)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      # Install deps so npm audit has a full dependency tree to scan.
      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --prefer-offline

      # npm audit exits non-zero for any vulnerability.
      # We parse the JSON to split Critical/High (block) from Moderate/Low (warn).
      - name: Run npm audit
        working-directory: apps/web
        run: |
          npm audit --json > npm-audit-report.json 2>&1 || true
          npm audit --omit=dev --json > npm-audit-prod.json 2>&1 || true

      - name: Evaluate npm audit results
        working-directory: apps/web
        run: |
          python3 - <<'EOF'
          import json, sys

          # Acknowledged advisories that don't affect this SPA (Vite client-side only):
          # - react-router RSC-mode CSRF: only affects React Server Components (SSR/RSC)
          # - react-router RSC XSS: only affects RSC error handling
          # Review and remove entries when patched versions are available.
          ACKNOWLEDGED = {
              "react-router",
              "react-router-dom",
          }

          # Production dependencies only — these block the pipeline.
          with open("npm-audit-prod.json") as f:
              try:
                  prod_report = json.load(f)
              except json.JSONDecodeError:
                  print("::warning::npm audit produced non-JSON output — skipping gate.")
                  sys.exit(0)

          # Full report (including dev) — shown as informational warnings.
          with open("npm-audit-report.json") as f:
              try:
                  full_report = json.load(f)
              except json.JSONDecodeError:
                  full_report = {"vulnerabilities": {}}

          # npm audit v2 JSON shape: { vulnerabilities: { <pkg>: { severity, ... } } }
          prod_vulns = prod_report.get("vulnerabilities", {})
          full_vulns = full_report.get("vulnerabilities", {})
          blocking_severities = {"critical", "high"}
          warn_severities     = {"moderate", "low", "info"}

          # Split: acknowledged HIGH (non-blocking), dev-only HIGH (non-blocking), actual blockers
          acknowledged = {k: v for k, v in prod_vulns.items()
                         if v.get("severity") in blocking_severities and k in ACKNOWLEDGED}
          dev_only_high = {k: v for k, v in full_vulns.items()
                          if v.get("severity") in blocking_severities and k not in prod_vulns}
          blocking = {k: v for k, v in prod_vulns.items()
                      if v.get("severity") in blocking_severities and k not in ACKNOWLEDGED}
          warnings = {k: v for k, v in full_vulns.items() if v.get("severity") in warn_severities}

          if warnings:
              print("::warning::npm audit — Moderate/Low vulnerabilities (non-blocking):")
              for pkg, info in warnings.items():
                  print(f"  [{info.get('severity','?').upper()}] {pkg} — {info.get('title', info.get('name',''))}")

          if dev_only_high:
              print("::warning::npm audit — Dev-only HIGH vulnerabilities (non-blocking):")
              for pkg, info in dev_only_high.items():
                  print(f"  [{info.get('severity','?').upper()}] {pkg} — {info.get('title', info.get('name',''))}")

          if acknowledged:
              print("::warning::npm audit — Acknowledged HIGH (no fix available, does not affect SPA):")
              for pkg, info in acknowledged.items():
                  print(f"  [{info.get('severity','?').upper()}] {pkg} — {info.get('title', info.get('name',''))}")

          if blocking:
              print("::error::npm audit — Critical/High vulnerabilities BLOCK this pipeline:")
              for pkg, info in blocking.items():
                  print(f"  [{info.get('severity','?').upper()}] {pkg} — {info.get('title', info.get('name',''))}")
              sys.exit(1)

          print(f"npm audit passed. Blocking: 0 | Acknowledged: {len(acknowledged)} | Dev-only: {len(dev_only_high)} | Low: {len(warnings)}")
          EOF

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: apps/web/npm-audit-report.json
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Gate — final summary job. Depends on all 5 scanners.
  # GitHub marks the PR as failed if any dependency job fails.
  # ---------------------------------------------------------------------------
  gate:
    name: "Security Gate"
    runs-on: ubuntu-latest
    needs: [bandit, bandit-lambdas, semgrep, gitleaks, pip-audit, pip-audit-lambdas, npm-audit]
    # Run even if upstream jobs failed so we always emit a clear summary.
    if: always()
    steps:
      - name: Evaluate gate
        run: |
          results='${{ toJSON(needs) }}'
          echo "Job results: $results"

          # Check if any job failed, was cancelled, or was skipped unexpectedly.
          if echo "$results" | grep -qE '"result":\s*"(failure|cancelled|skipped)"'; then
            echo "::error::Security gate FAILED — one or more scanners found Critical/High issues."
            echo "Review the failed job logs and uploaded artifacts for details."
            exit 1
          fi

          echo "Security gate PASSED — no Critical/High findings across all scanners."
